services:
  laravel:
    build: ./laravel
    container_name: analityk_laravel
    ports:
      - "8000:8000"
    volumes:
      - ./laravel:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  python:
    build: ./python
    container_name: analityk_python
    volumes:
      - ./python:/app
    tty: true
